spring.application.name=backend
server.port=8080

# =====================================================
# CẤU HÌNH KẾT NỐI MYSQL (XAMPP)
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/rentmapthuephong?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# CẤU HÌNH JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect